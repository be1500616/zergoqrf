name: Test Suite

on:
  push:
    branches: [ main, develop, gitbutler/workspace ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.24.3'
  PYTHON_VERSION: '3.12'

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        python-version: ['3.12']
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Cache Python dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('apps/backend/pyproject.toml') }}
        restore-keys: |
          ${{ runner.os }}-pip-
          
    - name: Install dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Lint with flake8
      working-directory: ./apps/backend
      run: |
        flake8 app tests --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app tests --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics
        
    - name: Type check with mypy
      working-directory: ./apps/backend
      continue-on-error: true  # Allow to continue if mypy fails
      run: |
        mypy app --ignore-missing-imports || true
        
    - name: Format check with black
      working-directory: ./apps/backend
      run: |
        black --check --diff app tests
        
    - name: Run tests with coverage
      working-directory: ./apps/backend
      run: |
        pytest --cov=app --cov-report=xml --cov-report=term-missing --cov-fail-under=80 -v
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/backend/coverage.xml
        flags: backend
        name: backend-coverage
        fail_ci_if_error: false

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Cache Flutter dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.pub-cache
          apps/frontend/.dart_tool
        key: ${{ runner.os }}-flutter-${{ hashFiles('apps/frontend/pubspec.yaml') }}
        restore-keys: |
          ${{ runner.os }}-flutter-
          
    - name: Install Flutter dependencies
      working-directory: ./apps/frontend
      run: flutter pub get
      
    - name: Verify Flutter installation
      run: flutter doctor -v
      
    - name: Analyze code
      working-directory: ./apps/frontend
      run: flutter analyze --fatal-infos --fatal-warnings
      
    - name: Format check
      working-directory: ./apps/frontend
      run: dart format --set-exit-if-changed lib/ test/ integration_test/
      
    - name: Run unit and widget tests
      working-directory: ./apps/frontend
      run: flutter test --coverage --test-randomize-ordering-seed random
      
    - name: Install lcov for coverage processing
      run: sudo apt-get install -y lcov
      
    - name: Process coverage data
      working-directory: ./apps/frontend
      run: |
        # Remove test files from coverage
        lcov --remove coverage/lcov.info \
          '*/test/*' \
          '*/integration_test/*' \
          '*/.dart_tool/*' \
          '*/lib/generated/*' \
          '*/lib/*.g.dart' \
          -o coverage/lcov_filtered.info
          
        # Generate summary
        lcov --summary coverage/lcov_filtered.info
        
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        file: ./apps/frontend/coverage/lcov_filtered.info
        flags: frontend
        name: frontend-coverage
        fail_ci_if_error: false
        
    - name: Run golden test updates (on main branch only)
      if: github.ref == 'refs/heads/main'
      working-directory: ./apps/frontend
      run: flutter test --update-goldens test/golden/

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Install Flutter dependencies
      working-directory: ./apps/frontend
      run: flutter pub get
      
    - name: Run integration tests
      working-directory: ./apps/frontend
      run: |
        # Start Flutter test in web mode for integration tests
        flutter test integration_test/ || true  # Allow to continue if no integration tests

  build-tests:
    name: Build Tests
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: ${{ env.FLUTTER_VERSION }}
        channel: 'stable'
        
    - name: Install backend dependencies
      working-directory: ./apps/backend
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        
    - name: Install frontend dependencies
      working-directory: ./apps/frontend
      run: flutter pub get
      
    - name: Build backend (syntax check)
      working-directory: ./apps/backend
      run: python -m py_compile app/main.py
      
    - name: Build frontend APK
      working-directory: ./apps/frontend
      run: flutter build apk --debug
      
    - name: Build frontend web
      working-directory: ./apps/frontend
      run: flutter build web --debug

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run security scan with pip-audit (backend)
      working-directory: ./apps/backend
      continue-on-error: true
      run: |
        python -m pip install --upgrade pip
        pip install pip-audit
        pip-audit || true
        
    - name: Scan for secrets
      uses: trufflesecurity/trufflehog@main
      with:
        path: ./
        base: main
        head: HEAD

  summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests, integration-tests, build-tests]
    if: always()
    
    steps:
    - name: Test Results Summary
      run: |
        echo "## Test Results Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "| Component | Status |" >> $GITHUB_STEP_SUMMARY
        echo "|-----------|--------|" >> $GITHUB_STEP_SUMMARY
        echo "| Backend Tests | ${{ needs.backend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Frontend Tests | ${{ needs.frontend-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Integration Tests | ${{ needs.integration-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "| Build Tests | ${{ needs.build-tests.result }} |" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "Workflow completed at: $(date)" >> $GITHUB_STEP_SUMMARY
